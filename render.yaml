services:
  - type: web
    name: framingham-motors
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    disk:
      # Keep this mount and database file name unchanged when updating an existing Render service.
      # It preserves the current SQLite inventory during the Framingham Motors rebrand.
      name: inventory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: Inventory__DatabasePath
        value: /var/data/retrodrive.db
      - key: Admin__Password
        sync: false
      - key: Admin__SessionSecret
        generateValue: true
      - key: Close__ApiKey
        sync: false
      - key: Close__StatusId
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: SiteSettings__ShowroomAddress
        value: "865 Waverly St, Framingham, MA 01701"
      - key: SiteSettings__Phone
        value: "(508) 306-8170"
      - key: SiteSettings__Email
        value: sales@framinghammotors.com
      - key: SiteSettings__FooterDescription
        value: "Framingham Motors is focused on retro and classic collectible cars, supported by clear information and personal coordination."
      - key: SiteSettings__FooterHoursTitle
        value: "Showroom Hours"
      - key: SiteSettings__FooterOperationsTitle
        value: Operations
      - key: SiteSettings__FooterVipTitle
        value: "Private VIP List"
      - key: SiteSettings__FooterVipDescription
        value: "Receive alerts when a retro or classic vehicle joins the collection."
      - key: SiteSettings__ShowroomHours
        value: "Monday–Friday: 9:00 AM–6:00 PM\nSaturday: 10:00 AM–4:00 PM\nSunday: By appointment"
      - key: Shipping__PickupAddress
        value: "865 Waverly St, Framingham, MA 01701"
      - key: Shipping__PickupLatitude
        value: "42.2738807"
      - key: Shipping__PickupLongitude
        value: "-71.4336963"
      - key: TrustedNetwork__ContentJson
        value: >-
          {"metrics":[{"value":"Framingham, MA","label":"Showroom location","detail":"Visits by appointment"},{"value":"Vehicle-first","label":"Every listing","detail":"Specs, photos, and context"},{"value":"Nationwide","label":"Transport planning","detail":"Route estimates when needed"},{"value":"Direct","label":"Framingham support","detail":"Questions welcomed"}],"eyebrow":"The Framingham approach","title":"CLASSICS, CLEARLY PRESENTED","description":"Framingham Motors keeps the process centered on the vehicle, the details that matter, and a clear next step.","credentials":[{"icon":"licensed","title":"Vehicle-first listings","detail":"Available specifications, photos, and context in one place.","status":"Explore"},{"icon":"authorized","title":"Details before decisions","detail":"Use finance and transport planning when you are ready.","status":"Plan"},{"icon":"certified","title":"Personal next steps","detail":"Ask about a vehicle, trade-in, financing, or delivery from one place.","status":"Connect"}],"partners":[{"mark":"01","name":"Ally","category":"Finance partner","image":"/partners/ally.svg"},{"mark":"02","name":"Capital One","category":"Finance partner","image":"/partners/capitalone.svg"},{"mark":"03","name":"Montway","category":"Transport partner","image":"/partners/montway.svg"},{"mark":"04","name":"AutoTrader","category":"Marketplace partner","image":"/partners/autotrader.svg"},{"mark":"05","name":"CARFAX","category":"Vehicle history partner","image":"/partners/carfax.svg"},{"mark":"06","name":"CarShield","category":"Protection partner","image":"/partners/carshield.svg"}]}
      - key: About__ContentJson
        value: >-
          {"eyebrow":"Who we are","title":"ABOUT FRAMINGHAM MOTORS","intro":"Framingham Motors, Inc. focuses on retro and classic collectible cars with clear information and a straightforward buying experience.","story":{"title":"Our Story","paragraphs":["Framingham Motors is for people who value the character, history, and driving feel that make a retro or classic vehicle memorable.","We focus on thoughtful presentation and the details that help you understand each car before making a decision."],"imageCaption":"The Framingham standard: timeless vehicles and clear details.","licenseTitle":"Retro and classic vehicle specialists","licenseDetail":"Vehicle, documentation, and delivery details are reviewed with you before the next step."},"contact":{"title":"Contact & Location","addressLabel":"Showroom address","address":"865 Waverly St, Framingham, MA 01701","phoneLabel":"Phone","phone":"(508) 306-8170","phoneDetail":"By appointment","emailLabel":"Email","email":"sales@framinghammotors.com","emailDetail":"Reply during business hours","hoursLabel":"Business hours","hours":"Monday–Friday: 9:00 AM–6:00 PM\nSaturday: 10:00 AM–4:00 PM\nSunday: By appointment"},"stats":[{"value":"Framingham, MA","label":"Showroom","detail":"Visits by appointment"},{"value":"Nationwide","label":"Transport planning","detail":"Route estimates available"},{"value":"Direct","label":"Personal support","detail":"Clear answers at every step"},{"value":"Detailed","label":"Vehicle information","detail":"Condition and history context"}]}
      - key: Legal__ContentJson
        value: >-
          {"privacy":{"title":"Privacy Policy","updated":"Last updated: August 2026","sections":[{"heading":"1. Information We Collect","body":"We collect the information you choose to provide when you submit an inquiry, request financing or transport information, join the arrival list, or contact Framingham Motors. This can include your name, email address, phone number, and vehicle-related message."},{"heading":"2. How We Use Your Information","body":"We use this information to respond to your request, discuss a vehicle or transaction, provide requested updates, and improve our service. We do not sell your personal information."},{"heading":"3. Browser Storage","body":"This website uses essential browser storage for features such as saved inventory and form interactions. You can clear this data through your browser settings."},{"heading":"4. Data Security","body":"We use reasonable technical safeguards for information submitted through this website. Do not send sensitive payment or identity documents through general website forms unless Framingham Motors gives you a secure method to do so."},{"heading":"5. Contact","body":"Questions about privacy can be sent to Framingham Motors through the contact details on the About page."}]},"terms":{"title":"Terms of Service","updated":"Last updated: August 2026","sections":[{"heading":"1. Website Use","body":"By using this website, you agree to use it lawfully and to provide accurate contact information when submitting a request."},{"heading":"2. Vehicle Availability","body":"Framingham Motors may update inventory, pricing, descriptions, and availability at any time. Every vehicle is subject to prior sale and is available only when confirmed directly by Framingham Motors."},{"heading":"3. Listing Information","body":"Vehicle information is provided for general reference. Buyers should review the details for the specific vehicle and ask any questions before entering into a transaction."},{"heading":"4. Financing and Transport","body":"Payment estimates and delivery estimates are planning tools, not offers of credit, final quotes, or guarantees. Final terms are confirmed for the specific transaction."},{"heading":"5. Transaction Documents","body":"A purchase is governed by the final written documents provided for that vehicle. Those documents control if they differ from website information."},{"heading":"6. Contact","body":"For questions about these terms, contact Framingham Motors through the contact details on the About page."}]},"returns":{"title":"Purchase Terms","updated":"Last updated: August 2026","sections":[{"heading":"Vehicle-Specific Terms","body":"Retro and classic vehicles are unique. Deposit, purchase, cancellation, title, delivery, and any return terms are provided and agreed for the specific vehicle transaction."},{"heading":"Before You Commit","body":"Review the available vehicle information, ask questions about condition and documentation, and make sure the agreed terms are reflected in the final transaction documents."},{"heading":"Delivery Coordination","body":"If transport is arranged, the confirmed carrier, route, timing, and handoff details are provided for the specific vehicle. Website delivery estimates are starting points only."},{"heading":"Questions About an Agreement","body":"Contact Framingham Motors promptly if you have questions about a vehicle, a deposit, delivery, or the documents for your transaction."}]}}
